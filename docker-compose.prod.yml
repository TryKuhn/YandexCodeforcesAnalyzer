services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # append-only log so queued jobs survive a redis restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible blob storage. MinIO pulled its public images from Docker Hub
  # and quay.io in Sept 2026; RustFS speaks the same S3 API, and the backend
  # only uses plain S3 calls (aioboto3), so any S3 server fits here
  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s


  backend:
    image: ghcr.io/trykuhn/yandexcodeforcesanalyzer-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\"",
        ]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 6

  # runs queued jobs (submission judging); same image as the backend
  worker:
    image: ghcr.io/trykuhn/yandexcodeforcesanalyzer-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
    command: ["python", "-m", "jobs.run_worker"]
    # a healthy backend means the migrations the jobs table needs are applied
    depends_on:
      backend:
        condition: service_healthy
      judge:
        condition: service_started

  frontend:
    image: ghcr.io/trykuhn/yandexcodeforcesanalyzer-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  frontend-participant:
    image: ghcr.io/trykuhn/yandexcodeforcesanalyzer-frontend-participant:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  judge:
    image: ghcr.io/trykuhn/yandexcodeforcesanalyzer-judge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # the ONLY privileged container: isolate needs cgroups and namespaces
    # (host requirements: docs/judge/host-requirements.md)
    privileged: true
    expose:
      - "8001"
    environment:
      JUDGE_WORKERS: ${JUDGE_WORKERS:-2}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\"",
        ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - frontend-participant
      - backend

volumes:
  postgres_data:
  redis_data:
  s3_data:
  caddy_data:
  caddy_config: