services:
  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    # append-only log so queued jobs survive a redis restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  # S3-compatible blob storage. MinIO pulled its public images from Docker Hub
  # and quay.io in Sept 2026; RustFS speaks the same S3 API, and the backend
  # only uses plain S3 calls (aioboto3), so any S3 server fits here
  s3:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - s3_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
  # runs queued jobs (submission judging); no auto-reload - after editing
  # job/grading code run `make dev.restart.worker`
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["python", "-m", "jobs.run_worker"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    # a healthy backend means the migrations the jobs table needs are applied
    depends_on:
      backend:
        condition: service_healthy
      judge:
        condition: service_started
  judge:
    build:
      context: ./backend
      dockerfile: judge/Dockerfile
    # the ONLY privileged container: isolate needs cgroups and namespaces
    privileged: true
    ports:
      - "8001:8001"
    environment:
      JUDGE_WORKERS: 4
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_PORTAL=jury
    depends_on:
      - backend
  frontend-participant:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_PORTAL=participant
    depends_on:
      - backend


volumes:
  postgres_data:
  redis_data:
  s3_data:
