name: CD - Build and Deploy to Production

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  changes:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      judge: ${{ steps.filter.outputs.judge }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/judge/**'
            frontend:
              - 'frontend/**'
            judge:
              - 'backend/judge/**'
              - 'backend/api/user/polygon/archive/assets/testlib.h'

  # Every image gets the commit tag on every deploy: changed ones are rebuilt,
  # unchanged ones just get the tag added to their current :latest (no rebuild).
  # So docker-compose.prod.yml can run the whole stack on one IMAGE_TAG and a
  # rollback is a single tag switch.
  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            component: backend
            context: ./backend
            file: ./backend/Dockerfile.prod
            build_args: ""
          - image: frontend
            component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile.prod
            build_args: |
              VITE_API_URL=https://createmanager.duckdns.org/api
              VITE_PORTAL=jury
          # Caddy proxies /api on the contest domain too, so the participant
          # portal talks to its own origin and needs no CORS
          - image: frontend-participant
            component: frontend
            context: ./frontend
            file: ./frontend/Dockerfile.prod
            build_args: |
              VITE_API_URL=https://contest.createmanager.duckdns.org/api
              VITE_PORTAL=participant
          # shares the backend build context for testlib.h
          - image: judge
            component: judge
            context: ./backend
            file: ./backend/judge/Dockerfile
            build_args: ""

    env:
      IMAGE: ghcr.io/trykuhn/yandexcodeforcesanalyzer-${{ matrix.image }}
      CHANGED: ${{ needs.changes.outputs[matrix.component] }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # an image that was never pushed has no :latest to retag, so build it
      - name: Decide whether to build
        id: plan
        run: |
          if [ "$CHANGED" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "$IMAGE:latest" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$IMAGE:latest not found, building it for the first time"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-prod

      - name: Tag the unchanged image with this commit
        if: steps.plan.outputs.build == 'false'
        run: docker buildx imagetools create -t "$IMAGE:$IMAGE_TAG" "$IMAGE:latest"

  deploy:
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with health check and rollback
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            GHCR_USERNAME='${{ github.actor }}' \
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            IMAGE_TAG='${{ env.IMAGE_TAG }}' \
            bash -s << 'ENDSSH'
          set -e

          cd ~/YandexCodeforcesAnalyzer

          if [ ! -f .env ]; then
            echo "ERROR: .env file not found on server!"
            exit 1
          fi

          if command -v docker-compose >/dev/null 2>&1; then
            DC="docker-compose -f docker-compose.prod.yml"
          else
            DC="docker compose -f docker-compose.prod.yml"
          fi

          # our own images; postgres/redis/s3/caddy are never pulled here,
          # so a deploy can't silently upgrade them
          APP_SERVICES="backend worker judge frontend frontend-participant"

          echo "Pulling latest compose/config changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "Logging into GHCR..."
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

          # all app images share one tag, so the backend's tells the whole stack's
          PREV_TAG=""
          BACKEND_CID_OLD=$($DC ps -q backend 2>/dev/null || true)
          if [ -n "$BACKEND_CID_OLD" ]; then
            PREV_TAG=$(docker inspect --format='{{index .Config.Image}}' "$BACKEND_CID_OLD" 2>/dev/null | \
              sed 's/.*://' || true)
            echo "Previous tag: ${PREV_TAG:-unknown}"
          else
            echo "No previous backend container found (fresh deploy)"
          fi

          export IMAGE_TAG="$IMAGE_TAG"

          echo "Pulling new images ($IMAGE_TAG)..."
          $DC pull --quiet $APP_SERVICES

          # the worker waits for a healthy backend, so a broken backend makes
          # `up` itself fail - carry on to the health report and rollback
          echo "Restarting services..."
          $DC up -d --remove-orphans || echo "compose up reported an error"

          # the Caddyfile is bind-mounted: `up` does not notice edits to it
          $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile \
            || echo "WARNING: caddy reload failed, the old config stays active"

          echo "Current container status:"
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

          # Docker reports "healthy" as soon as a check passes (start_period only
          # suppresses early failures), so polling beats sleeping the full period.
          # A service without a healthcheck (worker) only has to stay running.
          wait_ready() {
            svc=$1
            for i in $(seq 1 60); do
              # `up` creates containers before returning, so none now means
              # it failed outright (e.g. an image could not be pulled)
              CID=$($DC ps -a -q "$svc")
              if [ -z "$CID" ]; then
                echo "$svc container was never created, see the compose up errors above"
                return 1
              fi
              STATUS=$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CID")
              echo "Attempt $i/60: $svc status = $STATUS"

              case "$STATUS" in
                healthy) return 0 ;;
                running)
                  # no healthcheck: make sure it is not crash-looping
                  sleep 10
                  [ "$(docker inspect --format='{{.RestartCount}}' "$CID")" = "0" ] \
                    && [ "$(docker inspect --format='{{.State.Status}}' "$CID")" = "running" ] \
                    && return 0
                  echo "$svc keeps restarting!"
                  return 1 ;;
                unhealthy|exited|dead)
                  echo "$svc failed!"
                  return 1 ;;
              esac
              sleep 5
            done
            echo "$svc was not ready in time"
            return 1
          }

          echo "Waiting 30s before polling health..."
          sleep 30

          HEALTHY=true
          for svc in backend judge worker; do
            if ! wait_ready "$svc"; then
              HEALTHY=false
              break
            fi
          done

          if [ "$HEALTHY" = "true" ]; then
            echo "All services are healthy - deployment successful!"
            echo "Cleaning dangling images..."
            docker image prune -f
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            exit 0
          fi

          echo "Health check failed!"
          $DC ps
          $DC logs --tail=100 backend worker judge postgres caddy

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$IMAGE_TAG" ]; then
            echo "Rolling back to previous tag: $PREV_TAG"
            # one service at a time: an image that is new in this release has
            # no old tag to go back to, and that must not block the others
            for svc in $APP_SERVICES; do
              IMAGE_TAG="$PREV_TAG" $DC up -d --no-deps "$svc" \
                || echo "could not roll back $svc (no image for $PREV_TAG?)"
            done
            echo "Rollback deployed. Current status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
          else
            echo "No previous tag available for rollback."
          fi

          exit 1
          ENDSSH
