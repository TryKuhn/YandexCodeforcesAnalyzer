name: CI Workflow

on:
  pull_request:
    # judge tickets stack on each other, so those PRs target a judge branch, not main
    branches: [main, 'judge/**', 'judge-*']
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      judge: ${{ steps.filter.outputs.judge }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/judge/**'
            frontend:
              - 'frontend/**'
            judge:
              - 'backend/judge/**'

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      # mypy needs the whole module graph (can't lint single files correctly),
      # but it is incremental: cache .mypy_cache so only changed modules + their
      # dependents are re-analysed. Primary key always misses (run_id) so each
      # run saves a fresh cache; restore-keys pulls the most recent prior one
      # (incl. main's, which a PR inherits). Cold cache => full ~40s check;
      # warm => ~7-10s. Whole-graph correctness is preserved either way.
      - name: Restore mypy cache
        uses: actions/cache@v4
        with:
          path: ./backend/.mypy_cache
          key: mypy-${{ runner.os }}-py3.11-${{ github.run_id }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.11-

      - name: Run mypy
        run: mypy . --ignore-missing-imports --explicit-package-bases

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

      SECRET_KEY: test-secret-key

      CF_CLIENT_ID: test
      CF_CLIENT_SECRET: test
      YANDEX_CLIENT_ID: test
      YANDEX_CLIENT_SECRET: test
      OPENAI_API_KEY: test

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./backend/requirements.txt

      # NOTE: the plagiarism_cpp C++ extension is NOT built here — the test
      # suite mocks it (see backend/conftest.py), so clang/llvm/cmake/boost and
      # the cmake build are unnecessary. psycopg2-binary needs no libpq-dev and
      # every other dep ships manylinux wheels, so no system packages are needed.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      # Restore testmon's coverage DB so pytest runs only tests whose covered
      # code changed. Primary key always misses (run_id) so each run saves a
      # fresh DB; restore-keys pulls the most recent prior DB (incl. main's,
      # which a PR inherits). Cold cache => testmon safely runs the whole suite.
      - name: Restore testmon data
        uses: actions/cache@v4
        with:
          path: ./backend/.testmondata
          key: testmon-${{ runner.os }}-py3.11-${{ github.run_id }}
          restore-keys: |
            testmon-${{ runner.os }}-py3.11-

      - name: Run tests (only those affected by the change)
        run: pytest --ignore=tests/api_tests/yandex --testmon -q --tb=short

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://createmanager.duckdns.org/api
        run: npm run build

      - name: Check build output
        run: test -f dist/index.html

  judge-test:
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend/judge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy app --ignore-missing-imports

      # only the isolate-free logic runs here, the sandbox itself needs a privileged host
      - name: Run tests
        run: pytest -q --tb=short

  # the real thing: build the sandbox image and judge actual solutions.
  # dev machines often lack cgroup v2, GitHub runners have it, so this is where
  # honest TLE/MLE/RE verdicts get verified.
  judge-e2e:
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report host capabilities
        run: ./scripts/judge/host-probe.sh || true

      - name: Build judge image
        run: docker build -f backend/judge/Dockerfile -t yca-judge backend

      - name: Start judge service
        run: |
          docker run -d --privileged --name judge -p 8001:8001 yca-judge
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done

      - name: Sanity-check isolate inside the container
        run: |
          docker exec judge isolate --cg --box-id=99 --init
          docker exec judge isolate --cg --box-id=99 --cleanup

      # the regression gate: every tagged solution must earn exactly its verdict
      - name: Run the oracle suite
        run: ./scripts/judge/run-oracle.py

      # the prod gate: escapes must stay impossible
      - name: Run sandbox escape attempts
        run: ./scripts/judge/run-security.py

      # a breach that leaves traces would show up here rather than in a verdict
      - name: Check the container was not tampered with
        run: |
          docker exec judge sh -c '! grep -q pwned /etc/passwd'
          docker exec judge sh -c 'test ! -e /etc/pwned -a ! -e /tmp/pwned'

      - name: Judge logs
        if: always()
        run: docker logs judge || true

  all-checks-passed:
    needs: [backend-lint, backend-test, frontend-build, judge-test, judge-e2e]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check if all jobs passed
        run: |
          if [[ "${{ needs.backend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-test.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.judge-test.result }}" == "failure" ]] || \
             [[ "${{ needs.judge-e2e.result }}" == "failure" ]]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed"
